<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz about HTML and CSS</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>✅ Basic HTML and CSS Quiz</h1>
    <form action="">
        <div class="form-item">
            <label for="q1">
                <span class="question-number">1.</span>
                What does the acronymn CSS stand for?
            </label>
            <input type="text" id="q1" name="q1">
        </div>
        <div class="form-item">
            <label for="q2">
                <span class="question-number">1.</span>
                How are id and class attributes selected in CSS?
            </label>
            <textarea id="q2" name="q2"></textarea>
        </div>
        <div class="form-item">
            <label for="q3">
                <span class="question-number">1.</span>
                Which of the following is a valid CSS comment?
            </label>
            <select id="q3" name="q3">
                <option value="" selected disabled>Choose one...</option>
                <option value="Option 1">/* This is a valid comment */</option>
                <option value="Option 2">// This is a valid comment</option>
                <option value="Option 3">&lt;!--This is a valid comment--!&gt;
                </option>
            </select>
        </div>
        <div class="form-item">
            <label for="q4">
                <span class="question-number">1.</span>
                What is the bottom margin given this declaration?
            </label>
            <code>
            margin: 10px 5px 15px;
        </code>
            <input type="number" id="q4" name="q4">
        </div>

        <button type="submit">Submit quiz</button>
    </form>
</body>

</html>
