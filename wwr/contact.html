<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us </title>
    <meta name="description" content="Find all necessary information to contact our services.">
    <meta name="author" content="Rafaela Stephanie Silva do Nascimento">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header class="heading">
        <img src="images/wwrlogo.png" alt="White Water Rafting Logo">
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div>
            <h1>Company Information</h1>
            <p>Adress: 1 2 3 Main Street </p>
            <p>Phone Number: +55 12345 6789</p>
            <p>Email: wwrcompany@outlook.com </p>
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d897.4451746522216!2d-47.83958303494104!3d-15.821156973997658!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1786052308041!5m2!1spt-BR!2sbr"
              width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
        <section>
            <div class="employ">
                <h2>We are here to serve you</h2>
                <img src="images/employeeone.webp" alt="Happy man smiling in a boat">
                <img src="images/employeetwo.webp" alt="Girl posing for a picture">
                <img src="images/employeethree.webp" alt="Happy employee photo">
            </div>
        </section>
        <form>
            <div>
                <label for="q1">
                    <span class="question-one">1.</span> Name:
                </label>
                <input type="text" id="q1" name="q1">
            </div>

            <div>
                <label for="q2">
                    <span class="question-two">2.</span> Email:
                </label>
                <input type="email" id="q2" name="q2">
            </div>
            <div>
                <label for="q3">
                    <span class="question-three">3.</span> Message:
                </label>
                <button>General Inquiry</button>
                <input type="radio" id="inquiry" name="inquiry">
                <button>Reservation Question</button>
                <input type="radio" id="question" name="question">
                <button>Website Suggestion</button>
                <input type="radio" id="suggestion" name="suggestion">
            </div>
            <div>
                <label for="q4">
                    <span class="question-four">4.</span> Message purpose:
                </label>
                <textarea id="q4" name="q4" rows="3" placeholder="Type here"></textarea>
            </div>
            <div>
                <label for="checkbox">Please subscribe me to the monthly newsletter</label>
                <input type="checkbox" id="checkbox" name="checkbox">
            </div>
            <button type="submit">Get in touch!</button>
        </form>
    </main>
    <footer>
        <p>© 2026, White Water Rafting, Rafaela Nascimento</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-6338508_1280.png" alt="Facebook icon"> </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.webp" alt="Linkedin icon"> </a>
            <a href="https://instagram.com">
                <img src="images/instagramlogo.jpg" alt="Instagram icon"> </a>
        </nav>
    </footer>

</body>

</html>
